{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow border-0 rounded-4">

                <div class="card-body p-4">

                    <h2 class="mb-4">
                        Edit User
                    </h2>

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">
                                Name
                            </label>

                            <input
                                type="text"
                                name="name"
                                class="form-control"
                                value="{{ user[1] }}"
                                required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                value="{{ user[2] }}"
                                required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Role
                            </label>

                            <select
                                name="is_admin"
                                class="form-select">

                                <option
                                    value="0"
                                    {% if user[5] == 0 %}selected{% endif %}>
                                    User
                                </option>

                                <option
                                    value="1"
                                    {% if user[5] == 1 %}selected{% endif %}>
                                    Administrator
                                </option>

                            </select>

                        </div>


                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-primary">

                                Save Changes

                            </button>

                            <a
                                href="/users"
                                class="btn btn-secondary">

                                Cancel

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
