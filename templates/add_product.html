{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center mt-4">

    <div class="col-md-7">

        <div class="card shadow border-0 rounded-4">

            <div class="card-body p-5">

                <h2 class="text-center mb-4">
                    Add Product
                </h2>

                <form method="POST">

                    <div class="mb-3">
                        <label class="form-label">Product Name</label>
                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            placeholder="Enter product name"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea
                            name="description"
                            class="form-control"
                            rows="3"
                            placeholder="Enter product description"
                            required></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Price (₹)</label>
                        <input
                            type="number"
                            name="price"
                            class="form-control"
                            placeholder="Enter price"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Stock</label>
                        <input
                            type="number"
                            name="stock"
                            class="form-control"
                            placeholder="Enter stock quantity"
                            required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Image Filename</label>
                        <input
                            type="text"
                            name="image"
                            class="form-control"
                            placeholder="Example: headphones.jpg"
                            required>

                        <div class="form-text">
                            Store the image inside
                            <strong>static/images/</strong>.
                            Example:
                            <strong>mouse.jpg</strong>
                        </div>
                    </div>

                    <button class="btn btn-success w-100">
                        Add Product
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
