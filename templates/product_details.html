{% extends "base.html" %}

{% block content %}

<div class="row mt-5">

    <div class="col-md-6">

        <img src="{{ s3_bucket }}/{{ product[4] }}",
        class="img-fluid rounded shadow">

    </div>

    <div class="col-md-6">

        <h2>{{ product[1] }}</h2>

        <p class="text-muted">

            {{ product[2] }}

        </p>

        <h3 class="text-success">

            ₹{{ product[3] }}

        </h3>

        <p>

            <strong>Stock :</strong>

            {{ product[5] }}

        </p>

        {% if product[5] > 0 %}

        <h2 class="fw-bold">{{ product[1] }}</h2>

<p class="text-warning">
    ★★★★☆ 4.5
</p>

        <a href="/add-to-cart/{{ product[0] }}"
        class="btn btn-primary btn-lg px-5">

            Add To Cart

        </a>

        <a href="/"
             class="btn btn-outline-secondary ms-2">

            Back

             </a>

        {% else %}

        <button class="btn btn-secondary" disabled>

            Out Of Stock

        </button>

        {% endif %}

    </div>

</div>

{% endblock %}
